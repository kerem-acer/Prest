name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # SDK from global.json (.NET 11) plus the .NET 10 runtime for the net10.0 test legs.
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --solution Prest.slnx --no-build -c Release
